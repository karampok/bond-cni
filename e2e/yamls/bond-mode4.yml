---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bond-mode4
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bond",
      "ifname": "bond0",
      "mode": "802.3ad",
      "miimon": "100",
      "lacpRate": "fast",
      "mtu": 1300,
      "linksInContainer": false,
      "links": [
        {"name": "eth3"},
        {"name": "eth4"}
      ]
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: bond-mode4
  labels:
    app: bond-mode4
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "bond-mode4", "interface": "bond0"}
      ]
spec:
  containers:
  - name: bond-mode4
    image: quay.io/karampok/snife:latest
    command: ["sleep", "infinity"]
