name: bond-cni-e2e

topology:
  nodes:
    k01:
      kind: k8s-kind
      startup-config: kind-cluster.yaml

    k01-worker:
      kind: ext-container
      exec:
        - curl -Lo /tmp/cni.tgz https://github.com/containernetworking/plugins/releases/download/v1.4.0/cni-plugins-linux-amd64-v1.4.0.tgz
        - tar -xzf /tmp/cni.tgz -C /opt/cni/bin
        - ip link set eth3 up
        - ip link set eth4 up

    sw:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.6.0
      entrypoint: sleep
      cmd: infinity
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link add bond0 type bond mode 802.3ad
        - bash -c "echo 100 > /sys/class/net/bond0/bonding/miimon"
        - bash -c "echo fast > /sys/class/net/bond0/bonding/lacp_rate"
        - ip link set eth3 down
        - ip link set eth3 master bond0
        - ip link set eth4 down
        - ip link set eth4 master bond0
        - ip link set bond0 up
        - ip link set eth3 up
        - ip link set eth4 up

  links:
    - endpoints: ["k01-worker:eth1", "sw:eth1"]
    - endpoints: ["k01-worker:eth2", "sw:eth2"]
    - endpoints: ["k01-worker:eth3", "sw:eth3"]
    - endpoints: ["k01-worker:eth4", "sw:eth4"]
